[project]
name = "arxiv-RAG"
version = "0.2.0"
description = "RAG arXiv avec embeddings réels, hybrid search, re-ranking et cache"
readme = "README.md"
requires-python = ">=3.12"

[project.dependencies]
fastapi = "^0.115.0"
uvicorn = {extras=["standard"], version="^0.30.0"}
httpx = "^0.27.2"
requests = "^2.32.3"
python-dotenv = "^1.0.1"
pydantic = "^2.8.2"
pydantic-settings = "^2.4.0"
loguru = "^0.7.2"
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.9"
opensearch-py = "^2.7.1"
pypdf = "^5.0.1"
gradio = "^4.44.0"
redis = "^5.0.8"
sentence-transformers = "^3.0.1"
torch = "^2.3.1"
numpy = "^1.26.4"
scikit-learn = "^1.5.1"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
